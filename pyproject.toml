[project]
name = "ltx-ic-lora-trainer"
version = "0.3.0"
description = "LTX-2 training toolkit (LoRA, sliders, audio, research features) — based on Musubi Tuner by kohya_ss"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate==1.6.0",
    "av==14.0.1",
    "bitsandbytes",
    "diffusers==0.32.1",
    "einops==0.7.0",
    "huggingface-hub==0.34.3",
    "opencv-python==4.10.0.84",
    "pillow>=11.3.0",
    "safetensors>=0.4.5",
    # "sageattention>=1.0.6",
    "toml==0.10.2",
    "tqdm==4.67.1",
    "transformers==4.56.1",
    "voluptuous==0.15.2",
    # LTX-2 Gemma tokenizer
    "sentencepiece==0.2.1",
]

[project.optional-dependencies]
cu124 = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",
]
cu128 = [
    "torch>=2.7.1",
    "torchvision>=0.22.1",
]
cu130 = [
    "torch>=2.9.1",
    "torchvision>=0.24.1",
]
webui = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.0.0",
    "aiofiles>=23.0.0",
    "python-multipart>=0.0.9",
]

[tool.uv]
conflicts = [
  [
    { extra = "cu124" },
    { extra = "cu128" },
    { extra = "cu130" },
  ],
]

[dependency-groups]
dev = [
  "ascii-magic==2.3.0",
  "matplotlib==3.10.0",
  "tensorboard",
  "prompt-toolkit==3.0.51",
  "ruff>=0.12.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", extra = "cu124" },
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
  { index = "pytorch-cu124", extra = "cu124" },
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 132
indent-width = 4
target-version = "py310"

lint.ignore = [
  "E402",  # module-import-not-at-top-of-file
  "E712",  # true-false-comparison
  "E721",  # type-comparison
  "E722",  # bare-except
  "E731",  # lambda-assignment
  "E741",  # ambiguous-variable-name
  "F601",  # multi-value-repeated-key-literal
  "F841",  # unused-variable
]

# Whether to enforce exclude and extend-exclude patterns, even for paths that are passed to Ruff explicitly
# This is used to ensure that certain files are always excluded via IDE formatters or external tool calls (CI, AI, etc.)
force-exclude = true

# Single-path or Relative patterns
# Extends the default exclude patterns documented at https://docs.astral.sh/ruff/settings/#exclude
extend-exclude = [
  "src/ltx_ic_lora_trainer/modules/scheduling_flow_match_discrete.py",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.ruff.lint.per-file-ignores]
# Ignore all rules for files with copyright headers from external sources
"src/ltx_ic_lora_trainer/modules/scheduling_flow_match_discrete.py" = ["ALL"]
# Pre-existing latent issues in upstream Musubi code (not introduced by the
# LTX-2 strip-down). Keeping them silenced so CI is clean; revisit when these
# files are refactored.
"src/ltx_ic_lora_trainer/networks/lora.py" = ["F821"]
"src/ltx_ic_lora_trainer/networks/lycoris_extensions.py" = ["F401"]
